version: '3.8'

services:
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - .env
    # 🔴 新增：將共用磁碟掛載到容器內的 /app/data
    volumes:
      - sqlite_data:/app/data

  worker:
    build: .
    command: celery -A core.celery_app worker --loglevel=info
    depends_on:
      - redis
    env_file:
      - .env
    # 🔴 新增：Worker 也掛載同一個共用磁碟
    volumes:
      - sqlite_data:/app/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

# 🔴 新增：定義共用磁碟名稱
volumes:
  sqlite_data: