version: '3.8'

services:
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000" # 裝在 DO Server1 裡,有兩個專案，port需要不同
    depends_on:
      - redis
    env_file:
      - .env
    restart: always
  
  worker:
    build: .
    command: celery -A core.celery_app worker --loglevel=info
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:alpine
    ports:
      - "6379:0"    
