version: '3.8'

services:
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "80:8000"
    depends_on:
      - redis
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data

  worker:
    build: .
    command: celery -A core.celery_app worker --loglevel=info
    depends_on:
      - redis
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  sqlite_data:
